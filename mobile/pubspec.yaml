name: ora
description: Ora — P2P offered-fare ride-hailing (passenger + driver).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^14.6.2
  dio: ^5.7.0
  uuid: ^4.5.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_app_check: ^0.4.1+4
  firebase_database: ^12.1.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.2
  flutter_chat_core: ^2.9.1
  flutter_chat_ui: ^2.12.0
  flyer_chat_text_message: ^2.6.1
  # flutter_chat_ui v2 composes on the new material_ui package (composer
  # resolves its Material + localizations) — direct dep since we import it.
  material_ui: ^1.9.0
  flyer_chat_system_message: ^2.2.1
  google_maps_flutter: ^2.12.3
  maplibre_gl: ^0.27.1
  geocoding: ^5.0.0

dependency_overrides:
  # flutter_chat_core requires freezed_annotation ^3.1.0; the app's own
  # freezed 2.5.8 codegen is unaffected (annotations are compile-time only).
  # TODO: migrate freezed 2.x -> 3.x (removes .when/.map helpers) separately.
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ora_logo.png
    - assets/branding/ora_app_icon.png
    - assets/branding/services/city_rides.jpg
    - assets/branding/services/intercity.jpg
    - assets/branding/services/courier.jpg
    - assets/branding/services/move.jpg
    - assets/branding/ride_card/
    - assets/branding/ride_card/icons/
    # Ride Request half-screen MapLibre preview (Ora dark style + markers).
    - assets/maps/preview/
    # Disposable MapLibre PoC only — safe to delete with the PoC feature.
    - assets/maps/poc/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
