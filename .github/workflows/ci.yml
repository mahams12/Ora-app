name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned — floating `stable` moved to a newer Dart SDK and hung
          # `dart run build_runner` for the full 6h job limit (cancelled
          # runs on Oct 14+). Must match the version devs verify locally.
          flutter-version: '3.35.6'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true
      - run: flutter pub get
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs --verbose
        timeout-minutes: 15
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  auth-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/auth-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Ride core concurrency proof
        run: npm run test:ride-proof

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Firestore emulator rules tests
        run: npm run test:firestore-rules
